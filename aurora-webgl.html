<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极光星空 · 纯代码实时版</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #err {
        position: fixed; inset: 0; display: none; place-items: center;
        color: #f88; font: 14px/1.7 Consolas, monospace; white-space: pre-wrap;
        padding: 24px; background: #100;
    }
    #tip {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        color: rgba(150, 210, 255, .45); font: 12px/1.6 "微软雅黑", sans-serif;
        letter-spacing: .1em; pointer-events: none; user-select: none;
        transition: opacity .8s ease;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">纯 WebGL 实时渲染 · 没有视频文件 · 鼠标移动可改变视角</div>
<div id="err"></div>
<script>
(function () {
    'use strict';

    var canvas = document.getElementById('c');
    var errBox = document.getElementById('err');
    var tip = document.getElementById('tip');

    function fail(msg) {
        errBox.style.display = 'grid';
        errBox.textContent = msg;
        tip.style.display = 'none';
    }

    var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
    var isGL2 = !!gl;
    if (!gl) gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
    if (!gl) { fail('这个浏览器没有可用的 WebGL 上下文'); return; }

    /* ---------------- 着色器 ---------------- */

    var VS = [
        'attribute vec2 aPos;',
        'varying vec2 vUv;',
        'void main(){',
        '  vUv = aPos * 0.5 + 0.5;',
        '  gl_Position = vec4(aPos, 0.0, 1.0);',
        '}'
    ].join('\n');

    // 公共噪声函数
    var NOISE = [
        'float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }',
        'float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }',
        'vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }',
        'float vnoise(vec2 p){',
        '  vec2 i = floor(p); vec2 f = fract(p);',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  float a = hash12(i), b = hash12(i + vec2(1.0, 0.0));',
        '  float c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));',
        '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
        '}',
        'float fbm(vec2 p){',
        '  float v = 0.0, a = 0.5;',
        '  for (int i = 0; i < 5; i++) { v += a * vnoise(p); p = p * 2.03 + 17.0; a *= 0.5; }',
        '  return v;',
        '}'
    ].join('\n');

    // 场景：极光 + 星空 + 星落 + 水面
    var FS_SCENE = [
        'precision highp float;',
        'varying vec2 vUv;',
        'uniform vec2 uRes;',
        'uniform float uTime;',
        'uniform vec2 uMouse;',
        NOISE,

        'const float HORIZON = 0.205;',

        // 极光弧线：一条从左侧升起、横贯画面再落下的彩带
        'float arcY(float x){',
        '  return 0.505 + 0.155 * sin(x * 3.05 + 0.55) + 0.062 * sin(x * 6.9 + 2.15) + 0.026 * sin(x * 11.7 + 4.2);',
        '}',

        // 竖直帘幕光柱
        'float curtain(vec2 p, float t){',
        '  float a = fbm(vec2(p.x * 55.0, p.y * 1.1 - t * 1.6));',
        '  float b = fbm(vec2(p.x * 130.0 + 5.0, p.y * 2.0 - t * 2.6));',
        '  float c = mix(a, b, 0.42);',
        '  return pow(clamp(c, 0.0, 1.0), 2.6);',
        '}',

        // 极光主体颜色（线性 HDR 空间）
        'vec3 aurora(vec2 uv, float t, out float mask){',
        '  float ax = uv.x + 0.014 * sin(uv.y * 3.4 + t * 2.1);',
        '  float ay = arcY(ax);',
        '  float d = uv.y - ay;',

        '  float cur = curtain(vec2(ax, uv.y), t);',
        '  cur = pow(cur, 1.65);',
        '  float w = (d > 0.0) ? 0.115 : 0.18;',
        '  float band = exp(-pow(d / w, 2.0));',
        '  float core = exp(-abs(d) * 30.0);',

        '  float env = fbm(vec2(ax * 3.2 + 11.0, uv.y * 0.55 - t * 0.35));',
        '  env = pow(clamp(env, 0.0, 1.0), 2.1) * 2.8;',

        '  float inten = band * (0.02 + cur * (0.70 + env * 1.70)) * 0.42;',
        '  inten *= (d > 0.0 ? 1.00 : 0.30);',
        '  inten *= smoothstep(-0.10, 0.22, uv.x) * smoothstep(1.10, 0.78, uv.x);',
        '  inten *= smoothstep(HORIZON - 0.02, HORIZON + 0.16, uv.y);',
        '  inten += core * 0.26 * smoothstep(-0.05, 0.20, uv.x) * smoothstep(1.05, 0.80, uv.x);',

        '  float h = clamp((uv.y - ay + 0.30) / 0.62, 0.0, 1.0);',
        '  vec3 cGreen  = vec3(0.05, 1.00, 0.60);',
        '  vec3 cTeal   = vec3(0.10, 0.62, 1.00);',
        '  vec3 cViolet = vec3(0.52, 0.20, 1.00);',
        '  vec3 cPink   = vec3(1.00, 0.22, 0.72);',
        '  vec3 col = mix(cGreen, cTeal, smoothstep(0.00, 0.46, h));',
        '  col = mix(col, cViolet, smoothstep(0.46, 0.92, h));',
        '  col = mix(col, cPink, core * 0.70);',

        '  mask = clamp(inten, 0.0, 1.0);',
        '  return col * inten;',
        '}',

        // 星落：两三层不同密度/速度的下坠光点带拖尾
        'float meteors(vec2 uv, float cols, float rows, float speed, float seed, float keep){',
        '  vec2 g = vec2(uv.x * cols, uv.y * rows);',
        '  vec2 id = floor(g);',
        '  vec2 f = fract(g) - 0.5;',
        '  vec2 rnd = hash22(id + seed);',
        '  if (rnd.y < keep) return 0.0;',
        '  float sp = speed * (0.5 + rnd.x * 1.4);',
        '  float head = fract(-uTime * sp + rnd.y * 7.0 + rnd.x * 3.0);',
        '  float dy = (f.y + 0.5) - head;',
        '  float dx = f.x - (rnd.x - 0.5) * 0.30;',
        '  float core = exp(-dx * dx * 900.0 - dy * dy * 5000.0);',
        '  float tail = exp(-dx * dx * 620.0) * exp(-dy * 5.5) * step(0.0, dy);',
        '  return core + tail * 0.45;',
        '}',

        'vec3 starfield(vec2 uv, float t){',
        '  vec3 c = vec3(0.0);',
        '  for (int i = 0; i < 3; i++) {',
        '    float s = 150.0 + float(i) * 190.0;',
        '    vec2 g = uv * s;',
        '    vec2 id = floor(g);',
        '    vec2 f = fract(g) - 0.5;',
        '    vec2 r = hash22(id + float(i) * 37.1);',
        '    float d = length(f - (r - 0.5) * 0.55);',
        '    float tw = 0.55 + 0.45 * sin(t * (1.2 + r.x * 3.4) + r.y * 24.0);',
        '    float b = exp(-d * d * (200.0 + r.x * 300.0)) * step(0.79, r.y) * tw;',
        '    vec3 col = mix(vec3(0.62, 0.80, 1.00), vec3(1.00, 0.88, 0.74), r.x);',
        '    c += col * b * 1.75;',
        '  }',
        '  return c;',
        '}',

        'vec3 background(vec2 uv, float t){',
        '  float n1 = fbm(vec2(uv.x * 2.2, uv.y * 1.6) + vec2(0.0, -t * 0.02));',
        '  float n2 = fbm(vec2(uv.x * 5.4 + 9.0, uv.y * 3.8) + vec2(t * 0.03, 0.0));',
        '  vec3 deep = vec3(0.004, 0.008, 0.022);',
        '  vec3 blue = vec3(0.012, 0.045, 0.130);',
        '  vec3 col = mix(deep, blue, smoothstep(0.30, 0.98, n1));',
        '  col += vec3(0.012, 0.020, 0.055) * smoothstep(0.60, 1.0, n2);',
        '  col *= smoothstep(0.0, 0.62, uv.y * 1.5);',
        '  return col;',
        '}',

        'vec3 water(vec2 uv, float t){',
        '  float yy = HORIZON - uv.y;',
        '  float rip = fbm(vec2(uv.x * 22.0, yy * 90.0 - t * 0.6));',
        '  float rip2 = vnoise(vec2(uv.x * 120.0, yy * 320.0 + t * 1.4));',
        '  float smear = fbm(vec2(uv.x * 30.0, yy * 3.2 + t * 0.25));',
        '  // 水面接收上方极光的漫射',
        '  vec3 base = vec3(0.010, 0.030, 0.070);',
        '  base += vec3(0.05, 0.16, 0.34) * rip * 0.55;',
        '  // 水面反射的极光色（竖直拉长的模糊倒影）',
        '  float refl = exp(-yy * 9.0);',
        '  base += vec3(0.10, 0.35, 0.55) * refl * (0.10 + rip * 0.35);',
        '  // 极光在水面上的竖向倒影条纹',
        '  base += vec3(0.08, 0.38, 0.44) * pow(smear, 2.2) * exp(-yy * 3.2) * 0.55;',
        '  // 靠近水线的暖色灯火颗粒',
        '  float warm = exp(-pow((yy - 0.012) * 90.0, 2.0));',
        '  float sp = pow(rip2, 6.0) * smoothstep(0.0, 0.05, yy) * exp(-yy * 7.0);',
        '  base += vec3(1.00, 0.66, 0.30) * warm * 0.55;',
        '  base += vec3(1.00, 0.80, 0.45) * sp * 0.55;',
        '  // 细碎高光走起来',
        '  base += vec3(0.55, 0.85, 1.00) * pow(rip2, 12.0) * exp(-yy * 12.0) * 0.35;',
        '  return base * 0.45;',
        '}',

        'vec3 aces(vec3 x){',
        '  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;',
        '  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);',
        '}',

        'void main(){',
        '  vec2 uv = vUv;',
        '  float t = uTime;',
        '  vec2 par = (uMouse - 0.5) * vec2(0.012, 0.008);',
        '  vec2 p = uv + par;',

        '  vec3 col = background(p, t);',
        '  col += starfield(p, t);',

        '  float mask = 0.0;',
        '  vec3 au = aurora(p, t, mask);',
        '  col += au;',

        // 贴近水面的青绿散射光，让极光"落"到水上
        '  float lg = exp(-max(uv.y - HORIZON, 0.0) * 3.4);',
        '  float lgv = fbm(vec2(p.x * 9.0, p.y * 1.4 + t * 0.25));',
        '  col += vec3(0.020, 0.170, 0.200) * lg * (0.25 + lgv * 1.15) * 0.45;',

        // 星落层（在水面以上全部覆盖）
        '  float m = 0.0;',
        '  m += meteors(p, 42.0, 11.0, 0.40, 0.0, 0.86) * 0.95;',
        '  m += meteors(p, 80.0, 22.0, 0.68, 21.0, 0.90) * 0.55;',
        '  m += meteors(p, 140.0, 40.0, 1.00, 47.0, 0.93) * 0.30;',
        '  m *= smoothstep(HORIZON - 0.03, HORIZON + 0.09, uv.y);',
        '  vec3 meteorCol = mix(vec3(0.72, 0.90, 1.00), vec3(1.00, 0.92, 0.80), 0.35);',
        '  col += meteorCol * m * 1.05;',
        '  col += vec3(0.20, 0.45, 0.85) * m * 0.20;',

        // 高空薄雾
        '  float haze = fbm(vec2(p.x * 3.0, p.y * 2.0 + t * 0.05));',
        '  col += vec3(0.05, 0.10, 0.22) * smoothstep(0.55, 1.0, haze) * smoothstep(0.15, 0.8, p.y) * 0.30;',

        // 水面
        '  if (uv.y < HORIZON) {',
        '    vec3 w = water(uv, t);',
        '    float edge = smoothstep(HORIZON, HORIZON - 0.012, uv.y);',
        '    col = mix(col, w, edge);',
        '  }',

        // 暗角
        '  float vg = length((uv - 0.5) * vec2(1.0, 1.15));',
        '  col *= 1.0 - smoothstep(0.42, 1.02, vg) * 0.68;',

        // 色调映射 + 伽马
        '  col = aces(col * 0.95);',
        '  col = pow(col, vec3(1.0 / 2.2));',

        // 抖动，压掉暗部色带
        '  float dith = (hash12(gl_FragCoord.xy + fract(t) * 100.0) - 0.5) / 255.0;',
        '  col += dith;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
    ].join('\n');

    // 亮度提取 + 1/4 降采样
    var FS_BRIGHT = [
        'precision highp float;',
        'varying vec2 vUv;',
        'uniform sampler2D uTex;',
        'uniform vec2 uTexel;',
        'uniform float uThreshold;',
        'void main(){',
        '  vec2 o = uTexel;',
        '  vec3 s = vec3(0.0);',
        '  s += texture2D(uTex, vUv + vec2(-o.x, -o.y)).rgb;',
        '  s += texture2D(uTex, vUv + vec2( o.x, -o.y)).rgb;',
        '  s += texture2D(uTex, vUv + vec2(-o.x,  o.y)).rgb;',
        '  s += texture2D(uTex, vUv + vec2( o.x,  o.y)).rgb;',
        '  s *= 0.25;',
        '  float l = max(max(s.r, s.g), s.b);',
        '  float k = smoothstep(uThreshold, uThreshold + 0.35, l);',
        '  gl_FragColor = vec4(s * k, 1.0);',
        '}'
    ].join('\n');

    // 高斯模糊（方向可切）
    var FS_BLUR = [
        'precision highp float;',
        'varying vec2 vUv;',
        'uniform sampler2D uTex;',
        'uniform vec2 uDir;',
        'void main(){',
        '  vec3 s = texture2D(uTex, vUv).rgb * 0.227027;',
        '  s += texture2D(uTex, vUv + uDir * 1.3846154).rgb * 0.3162162;',
        '  s += texture2D(uTex, vUv - uDir * 1.3846154).rgb * 0.3162162;',
        '  s += texture2D(uTex, vUv + uDir * 3.2307692).rgb * 0.0702702;',
        '  s += texture2D(uTex, vUv - uDir * 3.2307692).rgb * 0.0702702;',
        '  gl_FragColor = vec4(s, 1.0);',
        '}'
    ].join('\n');

    var FS_COMPOSITE = [
        'precision highp float;',
        'varying vec2 vUv;',
        'uniform sampler2D uScene;',
        'uniform sampler2D uBloom;',
        'uniform float uBloomAmount;',
        'void main(){',
        '  vec3 c = texture2D(uScene, vUv).rgb;',
        '  vec3 b = texture2D(uBloom, vUv).rgb;',
        '  c += b * uBloomAmount;',
        '  gl_FragColor = vec4(c, 1.0);',
        '}'
    ].join('\n');

    /* ---------------- WebGL 脚手架 ---------------- */

    function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            throw new Error('着色器编译失败:\n' + gl.getShaderInfoLog(s));
        }
        return s;
    }

    function program(fsSrc) {
        var p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
            throw new Error('着色器链接失败:\n' + gl.getProgramInfoLog(p));
        }
        return {
            prog: p,
            u: function (n) { return gl.getUniformLocation(p, n); },
            a: function (n) { return gl.getAttribLocation(p, n); }
        };
    }

    var progScene, progBright, progBlur, progComp;
    try {
        progScene = program(FS_SCENE);
        progBright = program(FS_BRIGHT);
        progBlur = program(FS_BLUR);
        progComp = program(FS_COMPOSITE);
    } catch (e) {
        fail(String(e.message || e));
        return;
    }

    // 全屏三角形
    var vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    function bindQuad(prog) {
        var loc = prog.a('aPos');
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    }

    // 离屏纹理
    function makeTarget(w, h) {
        var tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        var fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { tex: tex, fb: fb, w: w, h: h };
    }

    /* ---------------- 尺寸与自适应 ---------------- */

    var scale = 1.0;          // 内部渲染分辨率比例
    // ?q=1 锁定分辨率比例（关闭自动降级），方便截图或手动调优
    var qp = new URLSearchParams(location.search);
    var fixedScale = qp.has('q') ? Math.min(1.0, Math.max(0.4, parseFloat(qp.get('q')) || 1.0)) : null;
    if (fixedScale) scale = fixedScale;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var targets = null;

    function resize() {
        var w = Math.max(1, Math.round(window.innerWidth));
        var h = Math.max(1, Math.round(window.innerHeight));
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        var sw = Math.max(2, Math.round(canvas.width * scale));
        var sh = Math.max(2, Math.round(canvas.height * scale));
        var bw = Math.max(2, Math.round(sw / 4));
        var bh = Math.max(2, Math.round(sh / 4));

        if (targets) {
            [targets.scene, targets.bright, targets.blurA, targets.blurB].forEach(function (t) {
                gl.deleteTexture(t.tex);
                gl.deleteFramebuffer(t.fb);
            });
        }
        targets = {
            scene: makeTarget(sw, sh),
            bright: makeTarget(bw, bh),
            blurA: makeTarget(bw, bh),
            blurB: makeTarget(bw, bh)
        };
    }

    var mouse = { x: 0.5, y: 0.5 };
    window.addEventListener('pointermove', function (e) {
        mouse.x = e.clientX / window.innerWidth;
        mouse.y = 1.0 - e.clientY / window.innerHeight;
        if (tip.style.opacity !== '0') { tip.style.opacity = '0'; }
    }, { passive: true });

    window.addEventListener('resize', function () { resize(); });

    /* ---------------- 渲染循环 ---------------- */

    var start = performance.now();
    var frames = 0;
    var acc = 0;
    var lastCheck = start;

    function draw(now) {
        var t = (now - start) / 1000;

        // --- 场景 ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets.scene.fb);
        gl.viewport(0, 0, targets.scene.w, targets.scene.h);
        gl.useProgram(progScene.prog);
        bindQuad(progScene);
        gl.uniform2f(progScene.u('uRes'), targets.scene.w, targets.scene.h);
        gl.uniform1f(progScene.u('uTime'), t);
        gl.uniform2f(progScene.u('uMouse'), mouse.x, mouse.y);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // --- 亮部提取 ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets.bright.fb);
        gl.viewport(0, 0, targets.bright.w, targets.bright.h);
        gl.useProgram(progBright.prog);
        bindQuad(progBright);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
        gl.uniform1i(progBright.u('uTex'), 0);
        gl.uniform2f(progBright.u('uTexel'), 1 / targets.scene.w, 1 / targets.scene.h);
        gl.uniform1f(progBright.u('uThreshold'), 0.62);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // --- 横向模糊 ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets.blurA.fb);
        gl.viewport(0, 0, targets.blurA.w, targets.blurA.h);
        gl.useProgram(progBlur.prog);
        bindQuad(progBlur);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, targets.bright.tex);
        gl.uniform1i(progBlur.u('uTex'), 0);
        gl.uniform2f(progBlur.u('uDir'), 1 / targets.blurA.w, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // --- 纵向模糊 ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets.blurB.fb);
        gl.viewport(0, 0, targets.blurB.w, targets.blurB.h);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, targets.blurA.tex);
        gl.uniform1i(progBlur.u('uTex'), 0);
        gl.uniform2f(progBlur.u('uDir'), 0, 1 / targets.blurB.h);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // --- 合成到屏幕 ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(progComp.prog);
        bindQuad(progComp);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
        gl.uniform1i(progComp.u('uScene'), 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, targets.blurB.tex);
        gl.uniform1i(progComp.u('uBloom'), 1);
        gl.uniform1f(progComp.u('uBloomAmount'), 0.70);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // --- 自适应分辨率 ---
        frames++;
        acc += now - (draw.last || now);
        draw.last = now;
        if (!fixedScale && now - lastCheck > 1500 && frames > 30) {
            var avg = acc / frames;
            if (avg > 22 && scale > 0.5) {
                scale = Math.max(0.5, scale - 0.15);
                resize();
            } else if (avg < 11 && scale < 1.0) {
                scale = Math.min(1.0, scale + 0.1);
                resize();
            }
            frames = 0; acc = 0; lastCheck = now;
        }

        window.__frame = (window.__frame || 0) + 1;
        requestAnimationFrame(draw);
    }

    resize();
    requestAnimationFrame(draw);

    // 给自动化检查用
    window.__aurora = {
        isGL2: isGL2,
        get scale() { return scale; },
        get frames() { return window.__frame || 0; }
    };
})();
</script>
